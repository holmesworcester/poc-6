[package]
name = "quiet_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "quiet_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

# Crypto
ring = "0.17"
base64 = "0.21"

# Parsing
nom = "7.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

[dev-dependencies]
# For property-based testing
proptest = "1.4"

[features]
default = []
# Enable Verus verification (when available)
verus = []
