[pytest]
# Run tests in parallel using all available CPU cores
# Use -n auto to automatically detect, or -n <num> to specify
# Excludes slow tests from default runs
addopts = -n auto -m "not slow"

# Custom markers
markers =
    slow: marks tests as slow (run with: pytest -m slow)
    networking: marks real networking tests (can run in parallel with thread-local callbacks)

# Test discovery settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Disable warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning

# Note: For test timeouts, install pytest-timeout and add: timeout = 300
