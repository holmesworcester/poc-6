[package]
name = "quic-holepunch"
version = "0.1.0"
edition = "2024"

[dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
socket2 = "0.5"
rand = "0.9"

[[bin]]
name = "quic-holepunch"
path = "src/main.rs"

[dev-dependencies]
