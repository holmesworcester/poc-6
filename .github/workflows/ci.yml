name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short

  network-scenarios:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run network simulator unit tests
        run: |
          PYTHONPATH=. pytest tests/test_network_simulator.py tests/test_nat_engine.py tests/test_network_scenarios.py -v --tb=short

      - name: Run network conditions integration tests
        run: |
          PYTHONPATH=. pytest tests/scenario_tests/test_network_conditions_sync.py -v --tb=short

      - name: Run scenario tests
        run: |
          PYTHONPATH=. pytest tests/scenario_tests/ -v --tb=short -k "not slow"
